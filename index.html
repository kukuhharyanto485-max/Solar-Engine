<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Engine - Ultra HD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* --- MENU UTAMA --- */
        #main-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 500; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(1, 2, 5, 0.7); backdrop-filter: blur(5px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        .menu-title {
            font-size: 2.5rem; font-weight: bold; color: #00ffff;
            letter-spacing: 6px; margin-bottom: 50px;
            text-shadow: 0 0 15px #00ffff; animation: pulse 2s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(0.97); opacity: 0.8; } to { transform: scale(1.03); opacity: 1; } }
        .menu-btn {
            background: transparent; border: 1px solid #ff0055;
            color: #ffffff; padding: 14px 40px; font-size: 1rem;
            font-family: inherit; letter-spacing: 4px; font-weight: bold;
            margin: 12px; cursor: pointer; width: 220px; transition: all 0.3s ease;
        }
        .menu-btn:hover, .menu-btn:active { background: #ff0055; color: #000; box-shadow: 0 0 20px #ff0055; }
        .btn-play { border-color: #00ffff; }
        .btn-play:hover, .btn-play:active { background: #00ffff; box-shadow: 0 0 20px #00ffff; }

        /* --- CONTAINER NAMA PLANET ELEGAN FLOATING --- */
        #labels-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; overflow: hidden;
            display: none; /* Muncul pas PLAY ditekan */
        }
        .planet-label {
            position: absolute; color: #ffffff; font-size: 0.65rem;
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            padding: 2px 6px; background: rgba(0, 0, 0, 0.6);
            border-left: 2px solid #00ffff; transform: translate(-50%, -100%);
            text-shadow: 0 0 4px #00ffff; white-space: nowrap;
            transition: opacity 0.2s;
        }
    </style>
    <script type="importmap">
      { 
        "imports": { 
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
        } 
      }
    </script>
</head>
<body>

    <div id="main-menu">
        <div class="menu-title">SOLAR ENGINE</div>
        <button class="menu-btn btn-play" id="btn-play">PLAY</button>
        <button class="menu-btn" onclick="alert('Graphics: Ultra Custom Shaders V4')">SETTING</button>
    </div>

    <div id="labels-container" id="labels-box"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const labelsContainer = document.getElementById('labels-container');

        // --- GRAPHICS CORE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 40, 80);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- MATAHARI DIBIKIN TERANG BANGET (AMPLIFIED LIGHTING) ---
        const sunLight = new THREE.PointLight(0xffffff, 20, 800); // Naik ke intensitas 20 biar silau mantap
        scene.add(sunLight);
        const ambientLight = new THREE.AmbientLight(0x0c0c1a);
        scene.add(ambientLight);

        let gameActive = false;
        document.getElementById('btn-play').addEventListener('click', () => {
            document.getElementById('main-menu').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('main-menu').style.visibility = 'hidden';
                labelsContainer.style.display = 'block';
            }, 800);
            gameActive = true;
        });

        // --- ENGINE CUSTOM SHADER (ULTRA HD FRESNEL + SPECULAR) ---
        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            uniform vec3 baseColor;
            uniform vec3 detailColor;
            uniform float noiseScale;
            uniform float time;
            uniform int isGas;

            float noise(vec2 p) {
                return sin(p.x * noiseScale + sin(p.y * 2.5)) * cos(p.y * noiseScale + time * 0.12);
            }

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                
                // Generasi kontras tinggi biar tekstur tajam gila
                float n = 0.0;
                if (isGas == 1) {
                    n = sin(vUv.y * noiseScale + sin(vUv.x * 6.0) * 0.7) * 0.5 + 0.5;
                } else {
                    n = noise(vUv * 12.0) * 0.5 + noise(vUv * 30.0) * 0.25 + 0.5;
                }

                vec3 surfaceColor = mix(baseColor, detailColor, clamp(n, 0.0, 1.0));
                
                // Efek Pendaran Atmosfer di Sisi Luar Bola
                float intensity = pow(1.0 - dot(normal, viewDir), 3.5);
                vec3 atmosphere = baseColor * intensity * 2.2;

                // Pencahayaan Utama Realistis
                float lightIntensity = max(dot(normal, vec3(0.0, 0.2, 1.0)), 0.1);

                gl_FragColor = vec4((surfaceColor * lightIntensity) + atmosphere, 1.0);
            }
        `;

        // BINTANG BACKGROUND
        const starsGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(4500 * 3);
        for(let i = 0; i < 4500 * 3; i++) starPos[i] = (Math.random() - 0.5) * 800;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

        // --- MATAHARI SUPER TERANG (CORE ENGINE) ---
        const sunMat = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader: `
                varying vec2 vUv;
                uniform float time;
                void main() {
                    float n = sin(vUv.x * 40.0 + time * 2.0) * cos(vUv.y * 40.0 + time * 1.5) * 0.15 + 0.85;
                    // Dibikin campuran putih-oranye neon biar terangnya kerasa solid
                    gl_FragColor = vec4(vec3(1.0, 0.5, 0.1) * n + vec3(1.0, 0.9, 0.6) * (1.0 - n), 1.0);
                }
            `,
            uniforms: { time: { value: 0 } }
        });
        const sun = new THREE.Mesh(new THREE.SphereGeometry(4.8, 64, 64), sunMat);
        scene.add(sun);

        // DATA KONFIGURASI PLANET BERSERTA NAMANYA
        const planetConfigs = [
            { name: "Mercury", dist: 10, size: 0.52, speed: 0.015, base: [0.35, 0.35, 0.35], detail: [0.15, 0.15, 0.15], scale: 35.0, gas: 0 },
            { name: "Venus", dist: 14, size: 0.88, speed: 0.012, base: [0.75, 0.45, 0.1], detail: [0.95, 0.65, 0.25], scale: 18.0, gas: 1 },
            { name: "Earth", dist: 18, size: 0.98, speed: 0.009, base: [0.05, 0.25, 0.65], detail: [0.1, 0.55, 0.15], scale: 22.0, gas: 0 },
            { name: "Mars", dist: 22, size: 0.68, speed: 0.007, base: [0.65, 0.12, 0.0], detail: [0.35, 0.02, 0.0], scale: 28.0, gas: 0 },
            { name: "Jupiter", dist: 30, size: 2.5, speed: 0.005, base: [0.75, 0.45, 0.25], detail: [0.95, 0.85, 0.7], scale: 45.0, gas: 1 },
            { name: "Saturn", dist: 39, size: 2.0, speed: 0.004, base: [0.85, 0.75, 0.45], detail: [0.55, 0.45, 0.25], scale: 38.0, gas: 1, hasRings: true },
            { name: "Uranus", dist: 46, size: 1.45, speed: 0.003, base: [0.0, 0.6, 0.6], detail: [0.3, 0.75, 0.65], scale: 12.0, gas: 1 },
            { name: "Neptune", dist: 53, size: 1.35, speed: 0.002, base: [0.1, 0.25, 0.7], detail: [0.0, 0.0, 0.35], scale: 18.0, gas: 1 }
        ];

        const planets = [];

        planetConfigs.forEach(config => {
            // Garis Orbit Tebal Menyala
            const orbitGeo = new THREE.RingGeometry(config.dist - 0.1, config.dist + 0.1, 128);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.28 });
            const orbitLine = new THREE.Mesh(orbitGeo, orbitMat);
            orbitLine.rotation.x = Math.PI / 2;
            scene.add(orbitLine);

            const mat = new THREE.ShaderMaterial({
                vertexShader, fragmentShader,
                uniforms: { baseColor: { value: new THREE.Color(...config.base) }, detailColor: { value: new THREE.Color(...config.detail) }, noiseScale: { value: config.scale }, time: { value: 0 }, isGas: { value: config.gas } }
            });
            
            // Ukuran vertex naikin biar lingkaran planet mulus total (HD)
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(config.size, 64, 64), mat);
            scene.add(mesh);

            if (config.hasRings) {
                const ringMesh = new THREE.Mesh(new THREE.RingGeometry(config.size * 1.3, config.size * 2.6, 64), new THREE.MeshBasicMaterial({ color: 0xcca45c, side: THREE.DoubleSide, transparent: true, opacity: 0.65 }));
                ringMesh.rotation.x = Math.PI / 2.1;
                mesh.add(ringMesh);
            }

            // Bikin elemen DOM tulisan teks nama secara otomatis
            const el = document.createElement('div');
            el.className = 'planet-label';
            el.textContent = config.name;
            labelsContainer.appendChild(el);

            planets.push({ mesh, dist: config.dist, speed: config.speed, mat, domElement: el, angle: Math.random() * Math.PI * 2 });
        });

        // Proyeksi koordinat 3D ke posisi layar 2D HP
        const tempV = new THREE.Vector3();
        function updateLabels() {
            if (!gameActive) return;
            planets.forEach(p => {
                p.mesh.updateMatrixWorld();
                p.mesh.getWorldPosition(tempV);
                
                // Cek posisi apakah di depan kamera
                tempV.project(camera);
                if (Math.abs(tempV.z) <= 1) {
                    const x = (tempV.x * .5 + .5) * window.innerWidth;
                    const y = (tempV.y * -.5 + .5) * window.innerHeight;
                    p.domElement.style.transform = `translate(-50%, -120%)`;
                    p.domElement.style.left = `${x}px`;
                    p.domElement.style.top = `${y}px`;
                    p.domElement.style.opacity = '1';
                } else {
                    p.domElement.style.opacity = '0';
                }
            });
        }

        // --- ANIMATION LOOP ---
        let clock = 0;
        function animate() {
            requestAnimationFrame(animate);
            clock += 0.02;

            sunMat.uniforms.time.value = clock;

            planets.forEach(p => {
                p.angle += p.speed;
                p.mesh.position.x = Math.cos(p.angle) * p.dist;
                p.mesh.position.z = Math.sin(p.angle) * p.dist;
                p.mesh.rotation.y += 0.014; // Putaran rotasi planet HD dipercepat dikit biar keren
                p.mat.uniforms.time.value = clock;
            });

            if (gameActive && camera.position.z > 52) {
                camera.position.z -= 0.5;
                camera.position.y -= 0.2;
            }

            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
